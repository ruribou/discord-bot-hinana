name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Run golangci-lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.0
      - name: Run reviewdog
        uses: reviewdog/action-golangci-lint@v1
        with:
          tool_name: golangci-lint
          reporter: github-pr-review
          filter_mode: diff
          fail_on_error: true
          level: error