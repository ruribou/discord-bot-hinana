name: Go CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
  # ジョブ名
  test:
    # ジョブ実行環境の指定
    runs-on: ubuntu-latest
    steps:
      # リポジトリからソースコードの取得
      - uses: actions/setup-go@v4
        with:
          go-version: 1.24.0
      # テストの実行
      - name: Run Test
        run: go test -v ./...